name: Update market signals

on:
  schedule:
    # 20:00 UTC == 04:00 台北 (UTC+8)
    - cron: '0 20 * * *'
  workflow_dispatch:
  # Also refresh data on every code deploy to main. The bot's own data commit is
  # made with GITHUB_TOKEN, which does not re-trigger workflows (no loop); the
  # paths-ignore is belt-and-suspenders for any data-only push.
  push:
    branches: [main]
    paths-ignore:
      - 'src/data/**'

permissions:
  contents: write

# Avoid overlapping runs racing on the same file.
concurrency:
  group: market-signals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch market signals
        run: node scripts/fetch-market-signals.mjs
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Append signal history
        run: node scripts/append-history.mjs

      - name: Fetch supplementary sources (Taiwan flows, sentiment)
        run: node scripts/fetch-extras.mjs

      # The commentary / business / leads / briefing steps used to run here.
      # They called GitHub Models, which was retired and returns HTTP 410, so
      # from 2026-07-30 they failed silently every day and left their JSON
      # untouched while the market-data steps above kept committing. They are
      # removed rather than left failing; a Claude routine now produces that
      # content and commits it directly. See docs/daily-email-briefing-routine.md.

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/market_signals.json src/data/signals_history.json \
                  src/data/taiwan_flows.json src/data/sentiment.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update market data ($(date -u +%Y-%m-%d))"
            git push
          fi
